<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - ShopEase
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <div class="auth-page">

        <div class="auth-container">

            <h1>
                ShopEase
            </h1>

            <p id="auth-title">
                Login to your account
            </p>


            <form
                id="auth-form"
            >

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    style="display: none;"
                >


                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >


                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >


                <button
                    type="submit"
                >
                    Login
                </button>

            </form>


            <p
                id="auth-message"
                class="auth-message"
            >
            </p>


            <button
                id="switch-auth"
                class="auth-switch"
                type="button"
            >
                Create New Account
            </button>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <script>

        const authForm =
            document.getElementById(
                "auth-form"
            );


        const nameInput =
            document.getElementById(
                "name"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const authMessage =
            document.getElementById(
                "auth-message"
            );


        const authTitle =
            document.getElementById(
                "auth-title"
            );


        const submitButton =
            authForm.querySelector(
                "button"
            );


        const switchButton =
            document.getElementById(
                "switch-auth"
            );


        let isRegisterMode = false;


        switchButton.addEventListener(
            "click",
            function () {

                isRegisterMode =
                    !isRegisterMode;


                if (
                    isRegisterMode
                ) {

                    authTitle.textContent =
                        "Create your account";


                    nameInput.style.display =
                        "block";


                    nameInput.required =
                        true;


                    submitButton.textContent =
                        "Register";


                    switchButton.textContent =
                        "Already have an account? Login";

                }

                else {

                    authTitle.textContent =
                        "Login to your account";


                    nameInput.style.display =
                        "none";


                    nameInput.required =
                        false;


                    submitButton.textContent =
                        "Login";


                    switchButton.textContent =
                        "Create New Account";

                }

            }
        );


        authForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value.trim();


                const name =
                    nameInput.value.trim();


                if (
                    !email ||
                    !password
                ) {

                    authMessage.textContent =
                        "Please fill all required fields.";

                    return;

                }


                if (
                    isRegisterMode
                ) {

                    if (!name) {

                        authMessage.textContent =
                            "Please enter your name.";

                        return;

                    }


                    const user = {

                        name,

                        email

                    };


                    localStorage.setItem(
                        "shopEaseUser",
                        JSON.stringify(
                            user
                        )
                    );


                    localStorage.setItem(
                        "shopEaseUserName",
                        name
                    );


                    localStorage.setItem(
                        "shopEaseLoggedIn",
                        "true"
                    );


                    window.location.href =
                        "index.html";

                }

                else {

                    const savedUser =
                        JSON.parse(
                            localStorage.getItem(
                                "shopEaseUser"
                            )
                        );


                    if (
                        savedUser &&
                        savedUser.email ===
                            email
                    ) {

                        localStorage.setItem(
                            "shopEaseLoggedIn",
                            "true"
                        );


                        localStorage.setItem(
                            "shopEaseUserName",
                            savedUser.name
                        );


                        window.location.href =
                            "index.html";

                    }

                    else {

                        authMessage.textContent =
                            "Account not found. Please register first.";

                    }

                }

            }
        );

    </script>

</body>

</html>
